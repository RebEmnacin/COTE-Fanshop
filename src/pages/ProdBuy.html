<html>
    <head>
        <link rel="stylesheet" href="../css/style.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="web">
            <div id="sidebar-placeholder"></div>
            <div class="panel">
                <div class="header-row">
                    <div class="nav-titles">
                        <div class="text-color">
                            <h3 class="text-pink">M</h3>
                            <h3 class="text-black">E</h3>
                            <h3 class="text-black">R</h3>
                            <h3 class="text-black">C</h3>
                            <h3 class="text-black">H</h3>
                            <h3 class="text-black">A</h3>
                            <h3 class="text-black">N</h3>
                            <h3 class="text-black">D</h3>
                            <h3 class="text-black">I</h3>
                            <h3 class="text-black">S</h3>
                            <h3 class="text-black">E</h3>
                        </div>
                    </div>
                    <button id="cart-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                    </button>
                </div>
                <div id="prod-panel">
                    <div id="bookshop-bg">
                        <div id="shop-back">
                            <a href="Books.html">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
                                Back
                            </a>
                        </div>
                        <div class="book-details">
                            <!-- These get filled in by bookshop.js -->
                            <img class="book-image" src="" alt="book"/>
                            <div class="book-info">
                                <h1 class="book-title"></h1>
                                <h2 class="book-type"></h2>
                                <p></p>
                                <h2 id="book-price"></h2>
                                <div id="bookshop-btn">
                                    <div id="item-qty">
                                        <button>-</button>
                                        <input type="number" value="1" min="1" max="10"/>
                                        <button>+</button>
                                    </div>
                                    <button><strong>ADD TO CART</strong></button>
                                    <button><strong>BUY NOW</strong></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="../js/data.js"></script>
    <script src="../js/bookshop.js"></script>
    <script src="../js/index.js"></script>
</html>
